version: "3.9"

services:
  # ── PostgreSQL + PostGIS ─────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: cleantrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleantrack
      POSTGRES_PASSWORD: cleantrack_pass
      POSTGRES_DB: cleantrack_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleantrack -d cleantrack_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: cleantrack_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Object Storage ─────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: cleantrack_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MinIO bucket setup (one-shot) ────────────────────────────
  minio_setup:
    image: minio/mc:latest
    container_name: cleantrack_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/cleantrack-photos;
        mc mb --ignore-existing local/cleantrack-thumbs;
        mc anonymous set download local/cleantrack-photos;
        mc anonymous set download local/cleantrack-thumbs;
        echo 'MinIO buckets ready.';
      "

  # ── FastAPI Main Application ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: cleantrack_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cleantrack:cleantrack_pass@db:5432/cleantrack_db
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      AI_SERVICE_URL: http://ai_service:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./app:/app/app
      - ./alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  # ── arq Background Worker ─────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: cleantrack_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cleantrack:cleantrack_pass@db:5432/cleantrack_db
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      AI_SERVICE_URL: http://ai_service:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: arq app.workers.worker_main.WorkerSettings

  # ── AI Microservice ──────────────────────────────────────────
  ai_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: cleantrack_ai
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cleantrack:cleantrack_pass@db:5432/cleantrack_db
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
    ports:
      - "8001:8001"
    volumes:
      - ./ai_service:/app/ai_service
      - ai_weights:/app/weights
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: bingo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
      - ai_service

volumes:
  pgdata:
  redisdata:
  miniodata:
  ai_weights:

networks:
  default:
    name: bingo_network
